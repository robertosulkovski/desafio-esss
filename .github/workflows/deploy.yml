
name: CI/CD - ESSS Challenge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q api

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-validation-only
        run: docker compose config --quiet

  deploy:
    name: Deploy to EC2
    runs-on: self-hosted
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy application
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          : "${EC2_HOST:?EC2_HOST não configurado}"
          : "${EC2_USER:?EC2_USER não configurado}"
          : "${EC2_SSH_PORT:?EC2_SSH_PORT não configurado}"
          : "${EC2_SSH_PRIVATE_KEY:?EC2_SSH_PRIVATE_KEY não configurado}"

          DEPLOY_DIR="/home/${EC2_USER}/desafio-esss"
          KEY_FILE="$(mktemp)"
          ARCHIVE="/tmp/desafio-esss-${GITHUB_RUN_ID}.tar.gz"

          cleanup() {
            rm -f "$KEY_FILE" "$ARCHIVE"
          }
          trap cleanup EXIT

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Registrar a chave do servidor antes de conectar.
          # Em produção, valide a fingerprint por um canal confiável.
          ssh-keyscan -p "$EC2_SSH_PORT" "$EC2_HOST" \
            >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

          SSH_OPTS="-p $EC2_SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes"

          ssh -i "$KEY_FILE" $SSH_OPTS \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$DEPLOY_DIR'"

          # Empacotar os arquivos sem segredos locais.
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=.venv \
            --exclude=__pycache__ \
            --exclude='*.pyc' \
            -czf "$ARCHIVE" .

          scp -i "$KEY_FILE" \
            -P "$EC2_SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$ARCHIVE" \
            "$EC2_USER@$EC2_HOST:/tmp/desafio-esss-${GITHUB_RUN_ID}.tar.gz"

          # Extrair os arquivos e implantar a aplicação.
          ssh -i "$KEY_FILE" $SSH_OPTS \
            "$EC2_USER@$EC2_HOST" \
            "set -eu
            tar -xzf '/tmp/desafio-esss-${GITHUB_RUN_ID}.tar.gz' -C '$DEPLOY_DIR'
            rm -f '/tmp/desafio-esss-${GITHUB_RUN_ID}.tar.gz'
            cd '$DEPLOY_DIR'
            sudo docker compose up -d --build
            sudo docker compose ps"

          # Executar o script de health check no servidor remoto.
          ssh -i "$KEY_FILE" $SSH_OPTS \
            "$EC2_USER@$EC2_HOST" \
            "bash '$DEPLOY_DIR/scripts/healthcheck.sh' \
            http://localhost:8000/health 12 5"
